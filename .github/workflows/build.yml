name: Multi-Platform Build (Windows EXE & macOS DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'app_desktop.py'
      - 'build_exe.py'
      - 'build_mac.py'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon & Intel)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bottle pywebview pyinstaller pillow pyobjc-framework-WebKit

      - name: Build macOS .app and .dmg
        run: |
          python build_mac.py

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows Single-File EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bottle pywebview pyinstaller pythonnet

      - name: Build Windows EXE
        run: |
          python build_exe.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/LoongAirHelper-Windows-EXE/*.exe
            release_assets/LoongAirHelper-macOS-DMG/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
