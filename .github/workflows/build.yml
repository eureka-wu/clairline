name: Multi-Platform Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (留空则自动根据最新 Git Tag 末位递增，如 v2.0.1 -> v2.0.2)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon M-Series)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyobjc-framework-WebKit

      - name: Build macOS Apple Silicon DMG
        run: |
          python scripts/build_mac.py

      - name: Upload macOS Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-macOS-AppleSilicon-DMG
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE (Slim & Instant Splash)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pythonnet

      - name: Build Windows EXE
        run: |
          python scripts/build_exe.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release (Multi-Platform)
    needs: [build-macos-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (for tag history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Determine Tag Name (Auto Increment or Manual)
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            # 自动查询最新已发布的 tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.1")
            echo "Found latest tag: $LATEST_TAG"
            
            # 解析末位并自动加 1 (例如 v2.0.1 -> v2.0.2)
            BASE_PREFIX=$(echo "$LATEST_TAG" | sed -E 's/(.*)\.[0-9]+$/\1/')
            LAST_NUM=$(echo "$LATEST_TAG" | sed -E 's/.*\.([0-9]+)$/\1/')
            NEW_NUM=$((LAST_NUM + 1))
            TAG_NAME="${BASE_PREFIX}.${NEW_NUM}"
            echo "Auto incremented to new tag: $TAG_NAME"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "长龙航空 · 畅飞智能助手 ${{ steps.vars.outputs.tag }}"
          body_path: docs/RELEASE_NOTES.md
          files: |
            release_assets/LoongAirHelper-Windows-EXE/*.exe
            release_assets/LoongAirHelper-macOS-AppleSilicon-DMG/*.dmg
          draft: false
          prerelease: false

  build-docker:
    name: Build & Push Multi-Arch Docker Image (GHCR)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

