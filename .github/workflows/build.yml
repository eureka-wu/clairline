name: Multi-Platform Build (Windows EXE & macOS Apple Silicon DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'app_desktop.py'
      - 'build_exe.py'
      - 'build_mac.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon M-Series)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyobjc-framework-WebKit

      - name: Build macOS Apple Silicon DMG
        run: |
          python build_mac.py

      - name: Upload macOS Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-macOS-AppleSilicon-DMG
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE (Slim & Instant Splash)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pythonnet

      - name: Build Windows EXE
        run: |
          python build_exe.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release (Multi-Platform)
    needs: [build-macos-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Determine Tag Name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "长龙航空 · 畅飞智能助手 ${{ steps.vars.outputs.tag }}"
          files: |
            release_assets/LoongAirHelper-Windows-EXE/*.exe
            release_assets/LoongAirHelper-macOS-AppleSilicon-DMG/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
