name: Build macOS DMG (Apple Silicon M-Series)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'app_desktop.py'
      - 'build_mac.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS DMG (Apple Silicon M1/M2/M3)
    # GitHub Actions 官方由 Apple Silicon (M-series, ARM64) 驱动的 macOS 运行环境
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyobjc-framework-WebKit

      - name: Build macOS Apple Silicon .app and .dmg
        run: |
          python build_mac.py

      - name: Upload macOS Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: LoongAirHelper-macOS-AppleSilicon-DMG
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release (macOS DMG)
    needs: [build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: LoongAirHelper-macOS-AppleSilicon-DMG
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
