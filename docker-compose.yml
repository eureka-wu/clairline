services:
  clairline:
    image: ghcr.io/eureka-wu/clairline:latest
    container_name: clairline
    restart: always
    # 资源配额限制 (当前日常占用约 24MB，限制 512MB 既轻量又防止异常占用)
    mem_limit: 512m
    mem_reservation: 64m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    ports:
      # 映射 Web 控制台与 API 端点 (生产环境若使用反向代理可修改为 127.0.0.1:3000:3000)
      - "${CLAIRLINE_PORT_MAPPING:-3000:3000}"
    volumes:
      # 本地持久化目录 (持久化存储 SQLite 数据库与用户配置)
      - ./data:/app/backend/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CLAIRLINE_HOST=${CLAIRLINE_HOST:-0.0.0.0}
      - CLAIRLINE_PORT=${CLAIRLINE_PORT:-3000}
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0 if urllib.request.urlopen(\"http://127.0.0.1:3000/api/status\").getcode() == 200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
