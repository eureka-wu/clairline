version: '3.8'

services:
  clairline:
    image: ghcr.io/eureka-wu/clairline:latest
    container_name: clairline
    restart: unless-stopped
    ports:
      # 映射 Web 控制台与 MCP SSE 智能助手端点
      - "3000:3000"
    volumes:
      # 持久化挂载 SQLite 数据库与用户配置（即使更新容器数据依然留存）
      - ./data:/app/backend/data
    environment:
      - TZ=Asia/Shanghai
      - CLAIRLINE_HOST=0.0.0.0
      - CLAIRLINE_PORT=3000
    # MCP 接入支持：
    # 方式一 (推荐，远程/跨机): http://<宿主机IP>:3000/sse
    # 方式二 (容器内标准管道): docker exec -i clairline python -m backend.mcp_server
